version: 1
name: qa-guardian
display_name: QA Guardian
archetype: qa-inspector
description: Vistorias, testes, correções e regressões com provas.
focus: Qualidade, pytest, vitest, CI e checklist de entrega
created_by: ravenna
learning:
  enabled: true
  tags:
  - qa
  - testing
  - review
  - regression
  - ci
  note_prefix: Agente qa-guardian
  on_start:
  - search_knowledge
  - get_context_for_task
  - get_related_errors
  - get_peer_insights
  on_complete:
  - add_learning_note
  - create_quiz
  - record_session
  - agent_share_insight
  on_unknown:
  - detect_agent_gaps
  - agent_research_gaps
  - search_and_learn
  - search_code
  on_failure:
  - record_failure
  peer_learning:
    enabled: true
    share_with: all_agents
    absorb_from: all_agents
    roundtable: true
mcp_tools:
  required:
  - search_knowledge
  - get_context_for_task
  - search_code
  - record_failure
  - add_learning_note
  recommended:
  - run_proofs
  - prove_python_code
  - create_quiz
  - record_session
  - get_related_errors
files:
  agent: .cursor/agents/qa-guardian.md
  playbook: agents/projects/qa-guardian/playbook.md
  learning_skill: .cursor/skills/qa-guardian-learning/SKILL.md
