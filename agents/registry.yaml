version: 1
vision: 'A Ravenna IDE é um ambiente onde você interage com seus próprios agentes.
  A Ravenna estrutura qualquer tipo de agente (backend, frontend, QA, dados, custom)
  com aprendizado contínuo — cada agente evolui a cada sessão via MCP.

  '
ravenna:
  role: primary-orchestrator
  specialties:
  - software-engineering
  - agent-creation
  - multi-agent-supervision
  - continuous-learning
kinds:
  agent_project:
    path_pattern: agents/projects/{name}/
    purpose: Projeto completo — manifest, playbook, subagente e skill de aprendizado
  cursor_subagent:
    path_pattern: .cursor/agents/{name}.md
    purpose: Subagente delegável no Cursor (Task / agents)
  cursor_skill:
    path_pattern: .cursor/skills/{name}/SKILL.md
    purpose: Workflow especializado acionado por contexto
  supervisor:
    path_pattern: learning_agent/core/supervision_agents.py
    purpose: Papel de supervisão no Observador (template Python)
archetypes:
- id: backend
  label: Backend Engineer
  summary: APIs, banco de dados, async, WebSockets
- id: frontend
  label: Frontend Engineer
  summary: UI, React, CSS, a11y, testes frontend
- id: qa-inspector
  label: QA Inspector
  summary: Vistorias, testes, correções e regressões
- id: data
  label: Data Engineer
  summary: Dados, ETL, SQL, RAG e pipelines
- id: custom
  label: Custom Agent
  summary: Agente sob medida para qualquer domínio
supervisors:
- id: cursor
  label: Cursor Agent
  focus: Coordenação, execução e provas
- id: architect
  label: Arquiteta
  focus: Camadas, contratos e decisões estruturais
- id: senior-fe
  label: Frontend Sênior
  focus: UI RemoteApp, a11y, testes frontend
- id: senior-be
  label: Backend Sênior
  focus: API, async, WebSocket
- id: reviewer
  label: Revisor
  focus: Segurança e regressões
- id: mentor
  label: Mentor
  focus: Diretivas explícitas para a Ravenna
- id: quiz-master
  label: Quiz Master
  focus: Consolidação e quizzes
user_agents:
- name: quiz-master
  kind: cursor_subagent
  file: .cursor/agents/quiz-master.md
  parent: ravenna
  focus: Quizzes e spaced repetition
  learning: false
- name: collab-agent-a
  kind: agent_project
  archetype: backend
  file: .cursor/agents/collab-agent-a.md
  project: agents/projects/collab-agent-a
  parent: ravenna
  focus: APIs
  learning: true
- name: collab-agent-b
