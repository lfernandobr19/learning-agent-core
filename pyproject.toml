[project]
name = "learning-agent"
version = "0.1.0"
description = "Ravenna learning-agent core: FastAPI + MCP + RAG + autonomy agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.12.0,<2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0.0",
    "pyyaml>=6.0.0",
    "paramiko>=3.4.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]
finance = ["yfinance>=0.2.0"]
cursor = ["cursor-sdk>=0.1.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0", "pygments>=2.19,<3"]
terminal = ["pywinpty>=2.0.13; sys_platform == 'win32'"]

[project.scripts]
learning-agent = "learning_agent.cli:main"
learning-agent-api = "learning_agent.api:run_server"
learning-agent-mcp = "learning_agent.mcp_server:main"
ravenna-telegram = "learning_agent.channels.telegram_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learning_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
